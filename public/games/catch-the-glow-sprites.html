<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Catch the Glow Sprites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --dusk-1: #171233;
    --dusk-2: #241c47;
    --dusk-edge: #0d0a20;
    --glow-teal: #7CFFC4;
    --glow-gold: #FFD166;
    --glow-pink: #FF9FE5;
    --glow-lilac: #B79CFF;
    --ink-light: #F3EFFF;
    --ink-dim: #B9AEE0;
    --panel-border: rgba(183, 156, 255, 0.35);
    --font-display: 'Baloo 2', system-ui, sans-serif;
    --font-body: 'Nunito', system-ui, sans-serif;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    margin: 0;
    padding: 0;
    height: 100%;
    background: transparent;
    font-family: var(--font-body);
  }

  .cgs-wrap{
    width: 100%;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .cgs-stage{
    position: relative;
    width: 100%;
    max-width: 800px;
    aspect-ratio: 16 / 9;
    border-radius: 28px;
    overflow: hidden;
    background: var(--dusk-edge);
    box-shadow:
      0 0 0 2px var(--panel-border),
      0 20px 60px rgba(10, 6, 30, 0.55);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  canvas{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* HUD */
  .cgs-hud{
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 14px 18px;
    z-index: 5;
    pointer-events: none;
  }

  .cgs-hud-left{
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: flex-start;
  }

  .cgs-pill{
    font-family: var(--font-display);
    font-weight: 700;
    color: var(--ink-light);
    background: rgba(13, 10, 32, 0.5);
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    padding: 6px 16px;
    font-size: 14px;
    letter-spacing: 0.02em;
    backdrop-filter: blur(4px);
    white-space: nowrap;
  }

  .cgs-pill.cgs-timer{ color: var(--glow-gold); }
  .cgs-pill.cgs-timer.cgs-urgent{
    color: var(--glow-pink);
    animation: cgsPulse 0.6s ease-in-out infinite;
  }

  .cgs-pill.cgs-compass{
    color: var(--glow-lilac);
    font-size: 13px;
  }

  @keyframes cgsPulse{
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  /* touch controls */
  .cgs-touch{
    position: absolute;
    left: 0; right: 0; bottom: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 16px;
    z-index: 6;
  }

  .cgs-dpad{
    display: flex;
    gap: 10px;
  }

  .cgs-tbtn{
    width: 58px;
    height: 58px;
    border-radius: 18px;
    border: 1px solid var(--panel-border);
    background: rgba(13, 10, 32, 0.5);
    color: var(--ink-light);
    font-family: var(--font-display);
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
    touch-action: none;
  }

  .cgs-tbtn:active{ background: rgba(124,255,196,0.25); }

  .cgs-tbtn.cgs-jump{
    width: 74px;
    height: 74px;
    border-radius: 22px;
    font-size: 14px;
    text-align: center;
    line-height: 1.2;
  }

  /* overlays: start + end screens */
  .cgs-overlay{
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 24px;
    z-index: 10;
    background: radial-gradient(120% 90% at 50% 0%, rgba(36,28,71,0.94) 0%, rgba(13,10,32,0.96) 70%);
  }

  .cgs-overlay.cgs-hidden{ display: none; }

  .cgs-title{
    font-family: var(--font-display);
    font-weight: 700;
    color: var(--ink-light);
    font-size: clamp(20px, 5vw, 30px);
    margin: 0;
    text-shadow: 0 0 18px rgba(124,255,196,0.35);
  }

  .cgs-sub{
    font-family: var(--font-body);
    color: var(--ink-dim);
    font-size: 14px;
    max-width: 380px;
    line-height: 1.5;
    margin: 0;
  }

  .cgs-badge{
    font-family: var(--font-display);
    font-size: 12px;
    color: var(--dusk-1);
    background: var(--glow-gold);
    border-radius: 999px;
    padding: 4px 12px;
    letter-spacing: 0.03em;
  }

  .cgs-scoreblock{
    display: flex;
    gap: 18px;
    margin: 6px 0 4px;
  }

  .cgs-scorecard{
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 10px 22px;
    min-width: 90px;
  }

  .cgs-scorecard .cgs-num{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 28px;
    color: var(--glow-teal);
    display: block;
  }

  .cgs-scorecard.cgs-best .cgs-num{ color: var(--glow-gold); }

  .cgs-scorecard .cgs-label{
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  .cgs-newbest{
    font-family: var(--font-display);
    color: var(--glow-gold);
    font-size: 14px;
    letter-spacing: 0.03em;
    margin: -4px 0 0;
    min-height: 18px;
  }

  .cgs-btnrow{
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 6px;
  }

  .cgs-btn{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 15px;
    border: none;
    border-radius: 999px;
    padding: 12px 26px;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: transform 120ms ease, box-shadow 120ms ease;
  }

  .cgs-btn:active{ transform: scale(0.96); }

  .cgs-btn-primary{
    background: linear-gradient(135deg, var(--glow-teal), #4fe0a0);
    color: #0d2a1e;
    box-shadow: 0 8px 20px rgba(124,255,196,0.3);
  }

  .cgs-btn-secondary{
    background: rgba(255,255,255,0.08);
    color: var(--ink-light);
    border: 1px solid var(--panel-border);
  }

  .cgs-btn-primary:hover{ box-shadow: 0 10px 26px rgba(124,255,196,0.45); }
  .cgs-btn-secondary:hover{ background: rgba(255,255,255,0.14); }

  @media (prefers-reduced-motion: reduce){
    .cgs-pill.cgs-urgent{ animation-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<div class="cgs-wrap">
  <div class="cgs-stage" id="cgsStage">
    <canvas id="cgsCanvas"></canvas>

    <div class="cgs-hud">
      <div class="cgs-hud-left">
        <div class="cgs-pill" id="cgsScorePill">Sprites: 0 / 0</div>
        <div class="cgs-pill cgs-compass" id="cgsCompassPill"></div>
      </div>
      <div class="cgs-pill cgs-timer" id="cgsTimerPill">0:45</div>
    </div>

    <div class="cgs-touch">
      <div class="cgs-dpad">
        <button class="cgs-tbtn" id="cgsLeftBtn" aria-label="Move left">&#9664;</button>
        <button class="cgs-tbtn" id="cgsRightBtn" aria-label="Move right">&#9654;</button>
      </div>
      <button class="cgs-tbtn cgs-jump" id="cgsJumpBtn" aria-label="Jump">JUMP</button>
    </div>

    <!-- Start screen -->
    <div class="cgs-overlay" id="cgsStartOverlay">
      <h1 class="cgs-title">Catch the Glow Sprites</h1>
      <p class="cgs-sub">Explore the forest and find every glowing sprite before time runs out. Walk with the arrow keys (or A / D) and jump with Space, Up, or W. On a tablet, use the buttons on screen.</p>
      <div class="cgs-scoreblock">
        <div class="cgs-scorecard cgs-best">
          <span class="cgs-num" id="cgsBestStart">0</span>
          <span class="cgs-label">Best Found</span>
        </div>
      </div>
      <div id="cgsClearedBadgeWrap"></div>
      <div class="cgs-btnrow">
        <button class="cgs-btn cgs-btn-primary" id="cgsStartBtn">Start</button>
      </div>
    </div>

    <!-- End screen -->
    <div class="cgs-overlay cgs-hidden" id="cgsEndOverlay">
      <h1 class="cgs-title" id="cgsEndTitle">Time's Up!</h1>
      <div class="cgs-scoreblock">
        <div class="cgs-scorecard">
          <span class="cgs-num" id="cgsFinalScore">0</span>
          <span class="cgs-label">Sprites Found</span>
        </div>
        <div class="cgs-scorecard cgs-best">
          <span class="cgs-num" id="cgsBestEnd">0</span>
          <span class="cgs-label">Best Found</span>
        </div>
      </div>
      <p class="cgs-newbest" id="cgsNewBest"></p>
      <div class="cgs-btnrow">
        <button class="cgs-btn cgs-btn-primary" id="cgsAgainBtn">Play Again</button>
        <button class="cgs-btn cgs-btn-secondary" id="cgsReturnBtn">Return to Glow Garden</button>
      </div>
    </div>
  </div>
</div>

  }

  // ---- Save data --------------------------------------------------------------
  function loadSave(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { best: 0, cleared: false };
      var parsed = JSON.parse(raw);
      return { best: parsed.best || 0, cleared: !!parsed.cleared };
    } catch (e){
      return { best: 0, cleared: false };
    }
  }
  function saveSave(data){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
  }

  var player = {

  };

  var GRAVITY = 0.62;
  var JUMP_VELOCITY = -12.6;
  var MAX_SPEED = 4.2;
  var ACCEL = 0.55;
  var FRICTION = 0.8;

  var keys = { left: false, right: false };
  var jumpQueued = false;
  var jumpHeld = false;

  function onKeyDown(e){
    if (['ArrowLeft','ArrowRight','ArrowUp',' ','Spacebar','a','A','d','D','w','W'].indexOf(e.key) !== -1){
      e.preventDefault();
    }
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ' || e.key === 'Spacebar'){
      if (!jumpHeld) jumpQueued = true;
      jumpHeld = true;
    }
  }
  function onKeyUp(e){
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ' || e.key === 'Spacebar') jumpHeld = false;
  }
  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', onKeyUp);

  function bindHold(el, onDown, onUp){
    el.addEventListener('touchstart', function(e){ e.preventDefault(); onDown(); }, { passive: false });
    el.addEventListener('touchend', function(e){ e.preventDefault(); onUp(); }, { passive: false });
    el.addEventListener('touchcancel', function(){ onUp(); });
    el.addEventListener('mousedown', function(e){ e.preventDefault(); onDown(); });
    el.addEventListener('mouseup', function(){ onUp(); });
    el.addEventListener('mouseleave', function(){ onUp(); });
  }
  bindHold(leftBtn, function(){ keys.left = true; }, function(){ keys.left = false; });
  bindHold(rightBtn, function(){ keys.right = true; }, function(){ keys.right = false; });
  bindHold(jumpBtn, function(){ if (!jumpHeld) jumpQueued = true; jumpHeld = true; }, function(){ jumpHeld = false; });

  // ---- Game state ------------------------------------------------------------
  var score = 0;
  var timeLeft = GAME_LENGTH_SECONDS;
  var running = false;
  var cameraX = 0;
  var lastTick = null;
  var timerAccum = 0;
  var particles = [];
  var floatTexts = [];
  var rafHandle = null;

  function resetLevel(){
    player.x = 80; player.y = GROUND_Y - player.h; player.vx = 0; player.vy = 0; player.onGround = true; player.facing = 1;
    for (var i = 0; i < spriteDefs.length; i++) spriteDefs[i].found = false;
    score = 0;
    timeLeft = GAME_LENGTH_SECONDS;
    particles = [];
    floatTexts = [];
    cameraX = 0;
  }

  function startGame(){
    resetLevel();
    scorePill.textContent = 'Sprites: 0 / ' + TOTAL_SPRITES;
    timerPill.textContent = formatTime(timeLeft);
    timerPill.classList.remove('cgs-urgent');
    startOverlay.classList.add('cgs-hidden');
    endOverlay.classList.add('cgs-hidden');
    running = true;
    lastTick = null;
    timerAccum = 0;
    if (rafHandle) cancelAnimationFrame(rafHandle);
    rafHandle = requestAnimationFrame(loop);
  }

  function formatTime(s){
    s = Math.max(0, Math.ceil(s));
    var m = Math.floor(s / 60);
    var sec = s % 60;
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function spawnBurst(x, y, color){
    for (var i = 0; i < 10; i++){
      var angle = (Math.PI * 2 * i) / 10;
      var dist = 1.6 + Math.random() * 1.6;
      particles.push({
        x: x, y: y,
        vx: Math.cos(angle) * dist,
        vy: Math.sin(angle) * dist,
        life: 30, maxLife: 30,
        color: color
      });
    }
    floatTexts.push({ x: x, y: y, life: 40, maxLife: 40 });
  }

  function updatePhysics(){
    // horizontal
    if (keys.left && !keys.right){
      player.vx -= ACCEL;
      player.facing = -1;
    } else if (keys.right && !keys.left){
      player.vx += ACCEL;
      player.facing = 1;
    } else {
      player.vx *= FRICTION;
      if (Math.abs(player.vx) < 0.05) player.vx = 0;
    }
    player.vx = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, player.vx));

    // jump
    if (jumpQueued && player.onGround){
      player.vy = JUMP_VELOCITY;
      player.onGround = false;
    }
    jumpQueued = false;

    // gravity
    player.vy += GRAVITY;
    if (player.vy > 16) player.vy = 16;

    // integrate
    var prevBottom = player.y + player.h;
    player.x += player.vx;
    player.y += player.vy;

    // level bounds
    player.x = Math.max(0, Math.min(LEVEL_WIDTH - player.w, player.x));

    // ground collision
    player.onGround = false;
    if (player.y + player.h >= GROUND_Y){
      player.y = GROUND_Y - player.h;
      player.vy = 0;
      player.onGround = true;
    }

    // platform collision (land on top only, when falling)
    if (player.vy >= 0){
      for (var i = 0; i < platforms.length; i++){
        var p = platforms[i];
        var withinX = player.x + player.w > p.x && player.x < p.x + p.w;
        var wasAbove = prevBottom <= p.y + 1;
        var nowAtOrBelow = (player.y + player.h) >= p.y;
        if (withinX && wasAbove && nowAtOrBelow && (player.y + player.h) <= p.y + p.h + 14){
          player.y = p.y - player.h;
          player.vy = 0;
          player.onGround = true;
        }
      }
    }

    // camera
    cameraX = player.x + player.w / 2 - VW / 2;
    cameraX = Math.max(0, Math.min(LEVEL_WIDTH - VW, cameraX));

    // collect sprites
    var px = player.x + player.w / 2;
    var py = player.y + player.h / 2;
    for (var j = 0; j < spriteDefs.length; j++){
      var sp = spriteDefs[j];
      if (sp.found) continue;
      var dx = px - sp.x;
      var dy = py - (sp.y + Math.sin(sp.bob) * 4);
      var dist2 = dx * dx + dy * dy;
      if (dist2 < (sp.r + 20) * (sp.r + 20)){
        sp.found = true;
        score += 1;
        scorePill.textContent = 'Sprites: ' + score + ' / ' + TOTAL_SPRITES;
        spawnBurst(sp.x, sp.y, sp.color);
      }
    }

    // particles
    for (var k = particles.length - 1; k >= 0; k--){
      var pt = particles[k];
      pt.x += pt.vx; pt.y += pt.vy; pt.life--;
      if (pt.life <= 0) particles.splice(k, 1);
    }
    for (var f = floatTexts.length - 1; f >= 0; f--){
      floatTexts[f].y -= 0.6;
      floatTexts[f].life--;
      if (floatTexts[f].life <= 0) floatTexts.splice(f, 1);
    }

    // compass toward nearest uncollected sprite
    updateCompass();

    if (score >= TOTAL_SPRITES){
      finishGame(true);
    }
  }

  function updateCompass(){
    var nearest = null, nearestDist = Infinity;
    var px = player.x + player.w / 2;
    for (var i = 0; i < spriteDefs.length; i++){
      var sp = spriteDefs[i];
      if (sp.found) continue;
      var d = Math.abs(sp.x - px);
      if (d < nearestDist){ nearestDist = d; nearest = sp; }
    }
    if (!nearest){
      compassPill.textContent = '';
      return;
    }
    var onScreen = (nearest.x > cameraX + 10 && nearest.x < cameraX + VW - 10);
    if (onScreen){
      compassPill.textContent = '\u2728 sprite nearby!';
    } else if (nearest.x < px){
      compassPill.textContent = '\u2190 sprite this way';
    } else {
      compassPill.textContent = 'sprite this way \u2192';
    }
  }

  function loop(ts){
    if (!running) return;
    if (lastTick === null) lastTick = ts;
    var dt = ts - lastTick;
    lastTick = ts;

    updatePhysics();

    timerAccum += dt;
    if (timerAccum >= 1000){
      timerAccum -= 1000;
      timeLeft -= 1;
      timerPill.textContent = formatTime(timeLeft);
      if (timeLeft <= 8) timerPill.classList.add('cgs-urgent');
      if (timeLeft <= 0){
        finishGame(false);
        return;
      }
    }

    render();
    rafHandle = requestAnimationFrame(loop);
  }

  // ---- Rendering ---------------------------------------------------------------
  function render(){
    ctx.clearRect(0, 0, VW, VH);

    // fallback fill in case artwork hasn't decoded yet
    var sky = ctx.createLinearGradient(0, 0, 0, VH);
    sky.addColorStop(0, '#0d0a20');
    sky.addColorStop(1, '#241c47');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, VW, VH);

    drawBackground();

    // platforms -- styled as glowing crystal ledges to match the artwork
    for (var i = 0; i < platforms.length; i++){
      var p = platforms[i];
      var sx = p.x - cameraX;
      if (sx + p.w < 0 || sx > VW) continue;
      var pg = ctx.createLinearGradient(sx, p.y, sx, p.y + p.h);
      pg.addColorStop(0, 'rgba(183,156,255,0.85)');
      pg.addColorStop(1, 'rgba(70,50,140,0.55)');
      ctx.save();
      ctx.shadowColor = 'rgba(183,156,255,0.6)';
      ctx.shadowBlur = 10;
      ctx.fillStyle = pg;
      roundRect(sx, p.y, p.w, p.h, 8);
      ctx.fill();
      ctx.restore();
    }

    // sprites (collectibles)
    for (var j = 0; j < spriteDefs.length; j++){
      var sp = spriteDefs[j];
      if (sp.found) continue;
      var sx2 = sp.x - cameraX;
      if (sx2 < -30 || sx2 > VW + 30) continue;
      var bobY = sp.y + Math.sin((Date.now() / 400) + sp.bob) * 4;
      var grad = ctx.createRadialGradient(sx2, bobY, 1, sx2, bobY, sp.r * 2);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.35, sp.color);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(sx2, bobY, sp.r * 1.8, 0, Math.PI * 2);
      ctx.fill();
    }

    // particles
    for (var k = 0; k < particles.length; k++){
      var pt = particles[k];
      var sxp = pt.x - cameraX;
      ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(sxp, pt.y, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // float texts (+1)
    ctx.font = '700 16px Baloo 2, sans-serif';
    ctx.textAlign = 'center';
    for (var f = 0; f < floatTexts.length; f++){
      var ft = floatTexts[f];
      var sxf = ft.x - cameraX;
      ctx.globalAlpha = Math.max(0, ft.life / ft.maxLife);
      ctx.fillStyle = '#ffffff';
      ctx.fillText('+1', sxf, ft.y);
      ctx.globalAlpha = 1;
    }

    // player
    drawPlayer();
  }

  function roundRect(x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawBgSpan(img, span, alpha){
    if (alpha <= 0.01) return;
    if (!(img.complete && img.naturalWidth)) return;
    var wx0 = span[0], wx1 = span[1];
    var spanW = wx1 - wx0;
    var sx = wx0 - cameraX;
    if (sx + spanW < 0 || sx > VW) return;
    ctx.globalAlpha = alpha;
    ctx.drawImage(img, sx, 0, spanW, VH);
    ctx.globalAlpha = 1;
  }

  function drawBackground(){
    // Crossfade between the two background paintings as the player
    // travels from the tree-house end of the forest to the waterfall end.
    var playerCenter = player.x + player.w / 2;
    var fadeStart = BG_WATERFALL_SPAN[0];   // 1100
    var fadeEnd = BG_TREEHOUSE_SPAN[1];     // 1700
    var t = (playerCenter - fadeStart) / (fadeEnd - fadeStart);
    t = Math.max(0, Math.min(1, t));

    drawBgSpan(bgTreehouseImg, BG_TREEHOUSE_SPAN, 1 - t);
    drawBgSpan(bgWaterfallImg, BG_WATERFALL_SPAN, t);
  }

  function drawPlayer(){
    var sx = player.x - cameraX;
    var feetY = player.y + player.h;
    var cx = sx + player.w / 2;

    if (charImg.complete && charImg.naturalWidth){
      var drawH = 68;
      var drawW = drawH * (charImg.naturalWidth / charImg.naturalHeight);

      ctx.save();
      ctx.shadowColor = 'rgba(124,255,196,0.55)';
      ctx.shadowBlur = 12;

      if (player.facing > 0){
        ctx.translate(cx, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(charImg, -drawW / 2, feetY - drawH, drawW, drawH);
      } else {
        ctx.drawImage(charImg, cx - drawW / 2, feetY - drawH, drawW, drawH);
      }
      ctx.restore();
    } else {
      // fallback shape while the artwork loads
      ctx.save();
      ctx.shadowColor = 'rgba(124,255,196,0.7)';
      ctx.shadowBlur = 14;
      ctx.fillStyle = '#7CFFC4';
      ctx.beginPath();
      ctx.ellipse(cx, feetY - player.h / 2, player.w / 2, player.h / 2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  // ---- End of round --------------------------------------------------------
  function finishGame(cleared){
    running = false;
    if (rafHandle) cancelAnimationFrame(rafHandle);

    var save = loadSave();
    var isNewBest = score > save.best;
    if (isNewBest) save.best = score;
    if (cleared) save.cleared = true;
    saveSave(save);

    endTitleEl.textContent = cleared ? 'You Found Them All!' : "Time's Up!";
    finalScoreEl.textContent = score;
    bestEndEl.textContent = save.best;
    newBestEl.textContent = isNewBest ? '\u2728 New Best! \u2728' : '';

    endOverlay.classList.remove('cgs-hidden');

    // Tell the parent hub page the round result immediately, without
    // waiting for the student to click Return. The hub records completion
    // server-side (student_planet_games), and this game only ever saved to
    // its own localStorage before, so this is the only way the hub finds
    // out a round happened at all.
    if (window.parent && window.parent !== window){
      window.parent.postMessage({ type: 'glowSpritesResult', game: 'catch-the-glow-sprites', cleared: cleared, score: score, total: TOTAL_SPRITES }, '*');
    }
  }

  function goToGlowGarden(){
    if (window.parent && window.parent !== window){
      window.parent.postMessage({ type: 'returnToGlowGarden', game: 'catch-the-glow-sprites' }, '*');
    } else {
      window.location.href = RETURN_URL;
    }
  }

  // ---- Init -----------------------------------------------------------------
  function initStart(){
    var save = loadSave();
    bestStartEl.textContent = save.best;
    clearedBadgeWrap.innerHTML = save.cleared ? '<span class="cgs-badge">Forest Cleared!</span>' : '';
    render();
  }

  resizeCanvas();
  initStart();

  startBtn.addEventListener('click', startGame);
  againBtn.addEventListener('click', startGame);
  returnBtn.addEventListener('click', goToGlowGarden);
})();
</script>

</body>
